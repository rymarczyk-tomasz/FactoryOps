# Demo frontendu na GitHub Pages: każdy push na branch `demo` buduje i publikuje aplikację.
name: Deploy demo to GitHub Pages

on:
  push:
    branches: [demo]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# tylko jedno wdrożenie naraz; nowszy push nie przerywa trwającego
concurrency:
  group: pages
  cancel-in-progress: false

defaults:
  run:
    working-directory: frontend/factory-ops

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22

      - id: pages
        uses: actions/configure-pages@v6

      - run: npm ci

      - run: npm test

      # base_path to np. "/FactoryOps" - aplikacja leży w podkatalogu
      - run: npm run build -- --base=${{ steps.pages.outputs.base_path }}/

      # GitHub Pages nie zna tras aplikacji - wejście wprost na /FactoryOps/list dostaje 404.html, czyli tę samą aplikację
      - run: cp dist/index.html dist/404.html

      - uses: actions/upload-pages-artifact@v5
        with:
          path: frontend/factory-ops/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
